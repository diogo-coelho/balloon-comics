name: balloon

services:

  auth-db:
    image: postgres:17-alpine
    container_name: balloon-auth-db
    restart: unless-stopped

    env-file:
      - ../.env

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    volumes:
      - /data/balloon/postgres-auth:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - auth-data


  core-db:
    image: postgres:17-alpine
    container_name: balloon-core-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}

    volumes:
      - /data/balloon/postgres-core:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - core-data


  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: balloon-rabbitmq
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - /data/balloon/rabbitmq:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Opcional.
    # Só acessível localmente na EC2.
    ports:
      - "127.0.0.1:15672:15672"

    networks:
      - messaging


  auth-service:
    build:
      context: ../balloon-auth-service
      dockerfile: Dockerfile

    container_name: balloon-auth-service
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 8081

      PG_DATABASE_HOST: auth-db
      PG_DATABASE_PORT: 5432
      PG_DATABASE_NAME: ${AUTH_DB_NAME}
      PG_DATABASE_USERNAME: ${AUTH_DB_USER}
      PG_DATABASE_PASSWORD: ${AUTH_DB_PASSWORD}

      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_TOKEN_AUDIENCE: ${JWT_TOKEN_AUDIENCE}
      JWT_TOKEN_ISSUER: ${JWT_TOKEN_ISSUER}
      JWT_TOKEN_EXPIRATION: ${JWT_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}

      NEXT_URL: ${NEXT_URL}

      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_URL: ${RABBITMQ_URL}

    expose:
      - "8081"

    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - edge
      - auth-data
      - messaging


  core-service:
    build:
      context: ../balloon-core-service
      dockerfile: Dockerfile

    container_name: balloon-core-service
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 8082

      PG_DATABASE_HOST: core-db
      PG_DATABASE_PORT: 5432
      PG_DATABASE_NAME: ${CORE_DB_NAME}
      PG_DATABASE_USERNAME: ${CORE_DB_USER}
      PG_DATABASE_PASSWORD: ${CORE_DB_PASSWORD}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_TOKEN_AUDIENCE: ${JWT_TOKEN_AUDIENCE}
      JWT_TOKEN_ISSUER: ${JWT_TOKEN_ISSUER}
      JWT_TOKEN_EXPIRATION: ${JWT_TOKEN_EXPIRATION}

      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_QUEUE_KEY: ${RABBITMQ_QUEUE_KEY}
      RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE}
      RABBITMQ_DEAD_LETTER_ROUTING_KEY: ${RABBITMQ_DEAD_LETTER_ROUTING_KEY}

      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_CLOUDFRONT_CDN_URL: ${AWS_CLOUDFRONT_CDN_URL}

    expose:
      - "8082"

    depends_on:
      core-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - edge
      - core-data
      - messaging


  balloon-ui:
    build:
      context: ../balloon-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: balloon-ui
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      AUTH_SERVICE_INTERNAL_URL: http://auth-service:8081
      CORE_SERVICE_INTERNAL_URL: http://core-service:8082

    expose:
      - "3000"

    networks:
      - edge


  nginx:
    image: nginx:alpine
    container_name: balloon-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - balloon-ui
      - auth-service
      - core-service

    networks:
      - edge


networks:

  edge:
    driver: bridge

  auth-data:
    driver: bridge
    internal: true

  core-data:
    driver: bridge
    internal: true

  messaging:
    driver: bridge
    internal: true