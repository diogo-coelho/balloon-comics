services:

  nginx:
    image: nginx:alpine
    container_name: balloon-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  localstack:
    image: localstack/localstack
    container_name: balloon-s3
    ports:
      - "4566:4566"

    env_file:
      - ../.env

    environment:
      - SERVICES=s3
      - DEBUG=1

    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: balloon-rabbitmq
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "15672:15672"
      - "5672:5672"

volumes:
  localstack-data:
  rabbitmq-data: