upstream auth_service {
  server host.docker.internal:${AUTH_SERVICE_PORT};
}

upstream core_service {
  server host.docker.internal:${CORE_SERVICE_PORT};
}

server {
  listen 80;
  server_name api.balloon.com;

  location /auth/ {
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /users/ {
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /readers/ {
    proxy_pass http://core_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}