services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: balloon-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ../.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: balloon-nginx
    ports:
      - "80:80"
    env_file:
      - ../balloon-auth-service/.env
      - ../balloon-core-service/.env
    environment:
      - AUTH_SERVICE_PORT=${AUTH_PORT:-8081}
      - CORE_SERVICE_PORT=${CORE_PORT:-8082}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro

  localstack:
    image: localstack/localstack
    container_name: balloon-s3
    ports:
      - "4566:4566"

    env_file:
      - ../.env

    environment:
      - SERVICES=s3
      - DEBUG=1

    volumes:
      - localstack-data:/var/lib/localstack    

volumes:
  rabbitmq-data:
  localstack-data: